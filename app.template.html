<meta charset="utf-8">
<title>車輛借用系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one shell, two work areas (rooms calendar + day panel / vehicle cards + log). Utility-grade, built for the W5 office and for phones at the car. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface2:#f5f7f9; --ink:#17202a; --mute:#566370; --line:#d3dae1;
  --accent:#1b4d7e; --on-accent:#ffffff; --focus:#2b7de0;
  --exec:#2d6aa8; --exec-bg:#e1ecf8;
  --c311:#c26a0a; --c311-bg:#fbeedb;
  --c304:#1d8552; --c304-bg:#dcf2e6;
  --cweb:#7242b5; --cweb-bg:#ebe3f7;
  --on-solid:#ffffff;
  --k1:#2d6aa8;--k1-bg:#e3eefa;--k2:#117f8c;--k2-bg:#d9f0f2;--k3:#c26a0a;--k3-bg:#fbeedb;--k4:#7242b5;--k4-bg:#efe8fa;--k5:#1d8552;--k5-bg:#dff3e8;--k6:#b8346a;--k6-bg:#fae4ee;--today-edge:#d98e00;
  --ok:#1b7447; --ok-bg:#dff2e7; --warn:#7c5600; --warn-bg:#fff2cc; --bad:#b3261e; --bad-bg:#fbe4e1;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c; --surface:#18202a; --surface2:#1e2832; --ink:#e5eaef; --mute:#9aa7b4; --line:#2e3944;
    --accent:#6aaeea; --on-accent:#0b1520; --focus:#7db8f0;
    --exec:#74aae6; --exec-bg:#1a2b3f;
    --c311:#f2a655; --c311-bg:#3a2a15;
    --c304:#55c48c; --c304-bg:#143428;
    --cweb:#b895f2; --cweb-bg:#2a2147;
    --on-solid:#10161c;
  --k1:#74aae6;--k1-bg:#1a2b3f;--k2:#4cc3cf;--k2-bg:#12343a;--k3:#f2a655;--k3-bg:#3a2a15;--k4:#b895f2;--k4-bg:#2a2147;--k5:#55c48c;--k5-bg:#143428;--k6:#f08ab4;--k6-bg:#3d1d2c;--today-edge:#f0b429;
    --ok:#62cc92; --ok-bg:#15342a; --warn:#f0cc6a; --warn-bg:#3b3012; --bad:#ff8f86; --bad-bg:#3d1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18202a; --surface2:#1e2832; --ink:#e5eaef; --mute:#9aa7b4; --line:#2e3944;
  --accent:#6aaeea; --on-accent:#0b1520; --focus:#7db8f0;
  --exec:#74aae6; --exec-bg:#1a2b3f;
  --c311:#f2a655; --c311-bg:#3a2a15;
  --c304:#55c48c; --c304-bg:#143428;
  --cweb:#b895f2; --cweb-bg:#2a2147;
  --on-solid:#10161c;
  --k1:#74aae6;--k1-bg:#1a2b3f;--k2:#4cc3cf;--k2-bg:#12343a;--k3:#f2a655;--k3-bg:#3a2a15;--k4:#b895f2;--k4-bg:#2a2147;--k5:#55c48c;--k5-bg:#143428;--k6:#f08ab4;--k6-bg:#3d1d2c;--today-edge:#f0b429;
  --ok:#62cc92; --ok-bg:#15342a; --warn:#f0cc6a; --warn-bg:#3b3012; --bad:#ff8f86; --bad-bg:#3d1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;min-height:38px}
button:hover{background:var(--surface2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card-click:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:40px}
textarea{min-height:68px;resize:vertical}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px}
header.top{background:var(--accent);color:var(--on-accent)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.02em}
.brand small{font-weight:400;opacity:.8;margin-left:8px;font-size:12px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:1px solid transparent;color:inherit;padding:6px 16px;border-radius:6px 6px 0 0;opacity:.85}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs button:hover{background:rgba(255,255,255,.14)}
.tabs button[aria-selected="true"]:hover{background:var(--bg)}
#notice{display:grid;gap:6px;padding-top:10px}
.note{border-radius:6px;padding:8px 12px;font-size:13px}
.note.soft{background:var(--warn-bg);color:var(--warn)}
.note.err{background:var(--bad-bg);color:var(--bad)}
.intro{color:var(--mute);font-size:13px;padding-block:10px 0}
.intro b{color:var(--ink)}
main{padding-block:12px 36px}
.rooms-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
@media (max-width:1000px){.rooms-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .month{font-size:17px;font-weight:700;min-width:130px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.chip{border-radius:16px;padding:3px 13px;min-height:32px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips label{font-size:13px;display:flex;gap:6px;align-items:center;margin-left:4px}
.chips input{width:auto;min-height:0}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:6px;text-align:center;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--surface2)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;cursor:pointer;overflow:hidden;min-width:0}
.day:nth-child(7n){border-right:none}
.day.out{background:var(--surface2);color:var(--mute)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .n{font-size:12px;padding:0 3px;color:var(--mute);font-variant-numeric:tabular-nums}
.day.today .n{color:var(--on-accent);background:var(--accent);border-radius:9px;padding:0 6px;display:inline-block}
.ev{--c:var(--exec);--t:var(--exec-bg);font-size:11.5px;line-height:1.35;border-left:3px solid var(--c);background:var(--t);border-radius:3px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.b311,.item.b311{--c:var(--c311);--t:var(--c311-bg)}
.ev.b304,.item.b304{--c:var(--c304);--t:var(--c304-bg)}
.ev.bWEBEX,.item.bWEBEX{--c:var(--cweb);--t:var(--cweb-bg)}
.more{font-size:11px;color:var(--mute);padding:1px 4px}
@media (max-width:640px){
  .day{min-height:62px;padding:2px}
  .ev{font-size:0;height:6px;padding:0;border:none;background:var(--c);margin-top:3px;border-radius:2px}
  .more{font-size:10px}
  .legend{margin-left:0}
}
.side .head{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.side h2{font-size:17px;margin:0;font-variant-numeric:tabular-nums}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h3{font-size:12px;color:var(--mute);margin:0 0 8px;font-weight:700;letter-spacing:.06em}
.tl-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}
.tl-name{font-size:12px;font-weight:700}
.tl-bar{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--surface2) 0,var(--surface2) calc(100%/12 - 1px),var(--surface) calc(100%/12 - 1px),var(--surface) calc(100%/12));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tl-blk{position:absolute;top:2px;bottom:2px;border-radius:3px;font-size:10px;overflow:hidden;color:var(--on-solid);padding:0 3px;white-space:nowrap;line-height:20px}
.tl-hours{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px}
.tl-hours div+div{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);font-family:var(--mono)}
.item{--c:var(--exec);--t:var(--exec-bg);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.item .t{font-weight:700}
.item .m{color:var(--mute);margin-top:2px}
.badge{display:inline-block;font-size:11px;border-radius:9px;padding:0 8px;margin-right:4px;color:var(--on-solid);font-weight:500;vertical-align:1px}
.badge.r311{background:var(--c311)}.badge.r304{background:var(--c304)}.badge.rWEBEX{background:var(--cweb)}.badge.rexec{background:var(--exec)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* vehicles */
.sec-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sec-title h2{margin:0;font-size:18px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:18px}
.vcard{padding:14px;display:grid;gap:10px;align-content:start}
.vcard .plate,.vhead .plate{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.04em}
.vrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{display:inline-block;border-radius:12px;padding:1px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.free{background:var(--ok-bg);color:var(--ok)}
.pill.busy{background:var(--warn-bg);color:var(--warn)}
.pill.flag{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);background:var(--surface2);font-weight:700}
.vpage{max-width:640px;margin-inline:auto;display:grid;gap:14px}
.vhead{padding:14px;display:grid;gap:10px}
.formcard{padding:14px 16px;display:grid;gap:12px}
.formcard h2{margin:0;font-size:18px}
.f>span{display:block;font-weight:700;font-size:14px;margin-bottom:3px}
.f>span em{color:var(--bad);font-style:normal}
.f small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}}
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;min-width:58px;background:var(--surface)}
.seg button[aria-pressed="true"].okb{background:var(--accent);color:var(--on-accent);font-weight:700}
.seg button[aria-pressed="true"].badb{background:var(--bad);color:var(--on-solid);font-weight:700}
.submitbar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.thumb{max-width:160px;max-height:120px;border-radius:6px;border:1px solid var(--line);display:block;margin-top:6px}
/* dialogs */
dialog{border:none;border-radius:10px;padding:0;width:min(560px,calc(100vw - 32px));max-height:92vh;background:var(--surface);color:var(--ink);box-shadow:0 12px 44px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form,.dbody{padding:18px 20px;display:grid;gap:12px}
dialog h2{margin:0;font-size:18px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.warn{border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.55}
.warn.err{background:var(--bad-bg);color:var(--bad)}
.warn.soft{background:var(--warn-bg);color:var(--warn)}
.warn.ok{background:var(--ok-bg);color:var(--ok)}
.inline{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.inline label{display:flex;gap:6px;align-items:center}
.inline input{width:auto;min-height:0}
#qrbox{display:grid;place-items:center;padding:12px;background:#fff;border-radius:8px;justify-self:center}
#qrbox img,#qrbox canvas{max-width:100%;height:auto}
.linkout{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--mute);user-select:all}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
#cTable th,#cTable td{border-left:1px solid var(--line)}
#cTable th:first-child,#cTable td:first-child{border-left:none}
#cTable th{color:var(--on-solid);font-size:13px;letter-spacing:.06em}
#cTable th:nth-child(1){background:var(--k1)}#cTable td:nth-child(1){background:var(--k1-bg);font-weight:700}
#cTable th:nth-child(2){background:var(--k2)}#cTable td:nth-child(2){background:var(--k2-bg)}
#cTable th:nth-child(3){background:var(--k3)}#cTable td:nth-child(3){background:var(--k3-bg)}
#cTable th:nth-child(4){background:var(--k4)}#cTable td:nth-child(4){background:var(--k4-bg)}
#cTable th:nth-child(5){background:var(--k5)}#cTable td:nth-child(5){background:var(--k5-bg)}
#cTable th:nth-child(6){background:var(--k6)}#cTable td:nth-child(6){background:var(--k6-bg)}
#cTable th:nth-child(7),#cTable td:nth-child(7){background:var(--surface)}
#cTable tr.wk td:not(:last-child){background-image:linear-gradient(color-mix(in srgb,var(--surface) 55%,transparent),color-mix(in srgb,var(--surface) 55%,transparent));color:var(--mute)}
#cTable tr.td td:not(:last-child){background-image:none;color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--today-edge),inset 0 -3px 0 var(--today-edge)}
#cTable tr.td td:first-child{box-shadow:inset 8px 0 0 var(--today-edge),inset 0 3px 0 var(--today-edge),inset 0 -3px 0 var(--today-edge)}
#cTable tr.td td:nth-child(1){background-color:color-mix(in srgb,var(--k1) 38%,var(--surface))}
#cTable tr.td td:nth-child(2){background-color:color-mix(in srgb,var(--k2) 38%,var(--surface))}
#cTable tr.td td:nth-child(3){background-color:color-mix(in srgb,var(--k3) 38%,var(--surface))}
#cTable tr.td td:nth-child(4){background-color:color-mix(in srgb,var(--k4) 38%,var(--surface))}
#cTable tr.td td:nth-child(5){background-color:color-mix(in srgb,var(--k5) 38%,var(--surface))}
#cTable tr.td td:nth-child(6){background-color:color-mix(in srgb,var(--k6) 38%,var(--surface))}
.day .hn{display:block;font-size:10.5px;line-height:1.3;color:var(--bad);font-weight:700;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .hn{background:var(--bad);color:var(--on-solid);border-radius:3px;margin:2px 2px 0;padding:0 5px}
.day.mk .hn{background:var(--warn)}
.day.mk{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.day.mk .n{color:var(--warn);font-weight:700}
.day.hol .n{color:var(--bad);font-weight:700}
.day.hol{background:color-mix(in srgb,var(--bad) 32%,var(--surface))}
.day.we{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.day.we .n{color:var(--bad)}
.day.hol.out,.day.mk.out,.day.we.out{opacity:.7}
.holtag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:9px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);font-size:11px;font-weight:700;vertical-align:1px;white-space:nowrap}
.holtag.mk{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
#cTable tr.hol td:not(:last-child){background-color:color-mix(in srgb,var(--bad) 34%,var(--surface));background-image:none}
#cTable tr.we td:not(:last-child){background-color:color-mix(in srgb,var(--bad) 17%,var(--surface));background-image:none}
#cTable tr.we td:nth-child(1),#cTable tr.we td:nth-child(2){color:var(--bad)}
#cTable tr.we td:first-child{box-shadow:inset 4px 0 0 color-mix(in srgb,var(--bad) 60%,var(--surface))}
#cTable tr.hol td:nth-child(1),#cTable tr.hol td:nth-child(2){color:var(--bad);font-weight:700}
#cTable tr.hol td:first-child:not(:only-child){box-shadow:inset 6px 0 0 var(--bad)}
#cTable tr.mk td:not(:last-child){background-color:color-mix(in srgb,var(--warn) 22%,var(--surface));background-image:none}
#cTable tr.mk td:nth-child(1),#cTable tr.mk td:nth-child(2){color:var(--warn);font-weight:700}
#cTable tr.mk td:first-child{box-shadow:inset 6px 0 0 var(--warn)}
#cTable tr.hol.td td:not(:last-child){background-color:color-mix(in srgb,var(--bad) 46%,var(--surface))}
#cTable tr.we.td td:not(:last-child){background-color:color-mix(in srgb,var(--bad) 26%,var(--surface))}
.att{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;cursor:pointer;line-height:1.4}
.att.open{display:block;-webkit-line-clamp:unset}
.attrow{display:flex;gap:2px}
.item .clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.item .clip.open{display:block}
.attrow .att{flex:1;min-width:0}
#cTable td.attcell{white-space:normal;width:210px;max-width:210px}
#cTable td.titlecell{white-space:normal;width:300px;max-width:300px;font-weight:500}
#cTable td.loccell{white-space:normal;width:170px;max-width:170px}
.holtag{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.routebox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.routebox>.mono{padding-top:9px;font-weight:700}
.bftag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:8px;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);vertical-align:1px}
.bftag.ed{background:var(--surface2);color:var(--mute);border-color:var(--line)}
.lastbox{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;display:grid;gap:2px}
.lb-k{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.lb-v{font-size:28px;font-weight:700;line-height:1.2}
.lb-s{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.55);color:inherit;min-height:32px;padding:3px 12px;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.14)}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.eqcard{padding:10px 12px;display:grid;gap:6px;align-content:start}

(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var WD=['日','一','二','三','四','五','六'];
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function tm(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtAt(iso){if(!iso)return '—';var d=pd(iso.slice(0,10));return (d.getMonth()+1)+'/'+d.getDate()+' '+iso.slice(11,16)}
function h(tag,a){
  var e=document.createElement(tag),val;
  if(a)for(var k in a){var v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k==='value')val=v;else if(k==='checked')e.checked=!!v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v)}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  if(val!==undefined)e.value=val;
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c))c.forEach(function(x){add(e,x)});
  else e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));
}
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}
function ask(msg,btns){
  return new Promise(function(res){
    var d=$('dlgAsk'),box=$('askBtns'),done=false;
    $('askMsg').textContent=msg;box.textContent='';
    function fin(v){if(done)return;done=true;d.close();res(v)}
    btns.forEach(function(b){box.appendChild(h('button',{type:'button',class:b[2]||'',text:b[0],onclick:function(){fin(b[1])}}))});
    d.addEventListener('cancel',function(){fin(0)},{once:true});
    d.showModal();
  });
}

/* ================= data layer ================= */
var NAMES=['vehicles','vehicleLogs','settings','vehicleRepairs','roster','places','vehicleDeleted'];
var data={vehicles:[],vehicleLogs:[],settings:[],vehicleRepairs:[],roster:[],places:[],vehicleDeleted:[]};
var db=null,dl=null,user=null,mode='connecting',canWrite=true,isAdmin=true,dbErr='';
var remote=false,API='',PIN='',REV=null,pollT=null,loaded=false,PIN_KEY='vehiclelog.pin';
var LKEY='vehiclelog.local.v1';
function fire(){try{renderAll()}catch(e){console.error(e)}}
function localLoad(){try{var r=localStorage.getItem(LKEY);if(r){var o=JSON.parse(r);NAMES.forEach(function(n){data[n]=o[n]||[]});return true}}catch(e){}return false}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify(data))}catch(e){}}
function put(n,obj){
  var body=JSON.parse(JSON.stringify(obj));var id=body.id;delete body.id;
  if(db)return db.doc(n+'/'+id).set(body);
  if(remote)return remoteWrite([{op:'set',collection:n,id:id,data:body}]);
  var i=data[n].findIndex(function(x){return x.id===id});
  if(i>=0)data[n][i]=obj;else data[n].push(obj);
  localSave();fire();return Promise.resolve();
}
function del(n,id){
  if(db)return db.doc(n+'/'+id).delete();
  if(remote)return remoteWrite([{op:'delete',collection:n,id:id}]);
  data[n]=data[n].filter(function(x){return x.id!==id});localSave();fire();return Promise.resolve();
}
function writeErr(e){
  var c=e&&e.code;
  toast(c==='invalid_argument'?(remote?'沒有權限執行這個操作，請改用管理者密碼。':'沒有寫入權限，請管理者將你設為 Contributor 以上。'):c==='quota_exceeded'?'資料量已達上限，請通知管理者。':'儲存失敗，請稍後再試。');
}
function seedLocal(){
  data.vehicles=[{id:'DEMO-001',plate:'DEMO-001',name:'示範車輛 1',lastMileage:1000},{id:'DEMO-002',plate:'DEMO-002',name:'示範車輛 2',lastMileage:25000}];
  data.vehicleLogs=[];data.settings=[];data.vehicleRepairs=[];data.roster=[];data.places=[];data.vehicleDeleted=[];
}
function startLocal(){mode='local';dl=fileSaver();if(!localLoad())seedLocal();fire()}
function subscribe(n){
  db.collection(n).onSnapshot(function(s){
    data[n]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});fire();
  },function(e){dbErr='資料連線中斷（'+(e&&e.code||'錯誤')+'），請重新整理頁面。';fire()});
}
async function connect(){
  var c=window.claude;
  API=String(window.VEHICLE_API||'').trim();
  if((!c||!c.use)&&API){await connectRemote();return}
  if(!c||!c.use){startLocal();return}
  try{db=await c.use('db')}catch(e){db=null}
  try{user=await c.use('user')}catch(e){user=null}
  try{dl=await c.use('downloads')}catch(e){dl=null}
  if(!db){startLocal();return}
  mode='shared';
  if(user){
    try{var w=await user.can('data.write');canWrite=(w!==false)}catch(e){}
    try{isAdmin=!!(await user.canEdit())}catch(e){}
  }
  NAMES.forEach(subscribe);
  fire();
}
/* ---- downloads on normal websites (the Claude Artifact provides its own save dialog) ---- */
function fileSaver(){
  return {save:function(o){return new Promise(function(res,rej){
    try{
      var d=o.data,f=String(o.filename||'file');
      var type=/\.html?$/i.test(f)?'text/html;charset=utf-8':/\.json$/i.test(f)?'application/json':/\.csv$/i.test(f)?'text/csv;charset=utf-8':/\.png$/i.test(f)?'image/png':'application/octet-stream';
      var blob=(typeof Blob!=='undefined'&&d instanceof Blob)?d:new Blob([d],{type:type});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);res({status:'saved'});
    }catch(e){rej(e)}
  })}};
}

/* ---- remote mode: static page + Google Apps Script web app (shared Google Sheet) ---- */
/* password is kept only for this browser tab (sessionStorage): closing the tab or scanning a QR code again asks again */
function lsGet(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{if(v)sessionStorage.setItem(k,v);else sessionStorage.removeItem(k)}catch(e){}}
try{localStorage.removeItem('vehiclelog.pin')}catch(e){}
function remoteErr(res){
  var c=res&&res.error;
  return {code:(c==='forbidden'||c==='auth')?'invalid_argument':c==='too_large'?'quota_exceeded':(c||'unavailable'),message:(res&&res.message)||c||'失敗'};
}
async function apiCall(body){
  var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN},body))});
  return await r.json();
}
function remoteApply(res){
  NAMES.forEach(function(n){data[n]=(res.data&&res.data[n])||[]});
  REV=res.rev;isAdmin=res.role==='admin';canWrite=true;loaded=true;dbErr='';fire();
}
function askPin(msg){
  return new Promise(function(resolve){
    var d=$('dlgPin');$('pinMsg').textContent=msg||'';$('pinInput').value='';
    $('pinOk').onclick=function(){var v=$('pinInput').value.trim();if(!v){$('pinMsg').textContent='請輸入密碼';return}d.close();resolve(v)};
    $('pinInput').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();$('pinOk').click()}};
    d.showModal();$('pinInput').focus();
  });
}
async function login(msg){
  msg=msg||'';
  for(;;){
    if(!PIN)PIN=await askPin(msg);
    try{
      var res=await apiCall({op:'list',force:true});
      if(res.ok){lsSet(PIN_KEY,PIN);remoteApply(res);return true}
      PIN='';lsSet(PIN_KEY,'');
      msg=res.error==='locked'?'密碼錯誤次數過多，請 10 分鐘後再試。':res.error==='not_configured'?'後端尚未設定密碼，請聯絡管理者。':'密碼不正確，請再輸入一次。';
    }catch(e){dbErr='無法連線到資料庫，請確認網路後重新整理頁面。';fire();return false}
  }
}
async function remoteRefresh(force){
  var res=await apiCall(force?{op:'list',force:true}:{op:'list',rev:REV});
  if(!res.ok){
    if(res.error==='auth'||res.error==='locked'){PIN='';lsSet(PIN_KEY,'');await login('密碼已失效，請重新輸入。');return}
    throw remoteErr(res);
  }
  if(res.changed!==false)remoteApply(res);
}
async function remoteWrite(ops){
  var res=await apiCall(ops.length===1?ops[0]:{op:'batch',ops:ops});
  if(!res.ok){
    if(res.error==='auth'){PIN='';lsSet(PIN_KEY,'');await login('密碼已失效，請重新輸入。')}
    throw remoteErr(res);
  }
  ops.forEach(function(o){
    var list=data[o.collection]||(data[o.collection]=[]),i=list.findIndex(function(x){return x.id===o.id});
    if(o.op==='delete'){if(i>=0)list.splice(i,1)}
    else{var doc=Object.assign({id:o.id},o.data);if(i>=0)list[i]=doc;else list.push(doc)}
  });
  fire();
  remoteRefresh(true).catch(function(){});
}
async function applyOps(chunk){
  if(remote){
    await remoteWrite(chunk.map(function(o){
      if(o[0]!=='set')return {op:'delete',collection:o[1],id:o[2]};
      var b=JSON.parse(JSON.stringify(o[2]));delete b.id;
      return {op:'set',collection:o[1],id:o[2].id,data:b};
    }));
    return;
  }
  for(var i=0;i<chunk.length;i++){var o=chunk[i];if(o[0]==='set')await put(o[1],o[2]);else await del(o[1],o[2])}
}
function startPoll(){
  clearInterval(pollT);
  pollT=setInterval(function(){if(document.hidden||isFormMode())return;remoteRefresh(false).catch(function(){})},15000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&remote&&!isFormMode())remoteRefresh(false).catch(function(){})});
}
async function connectRemote(){
  remote=true;mode='remote';isAdmin=false;canWrite=false;dl=fileSaver();PIN=lsGet(PIN_KEY);fire();
  if(await login(''))startPoll();
}
function setting(k){var s=data.settings.find(function(x){return x.id==='app'});return s&&s[k]||''}

/* ================= shell (single view) ================= */
function setTab(){renderAll(true)}
function renderNotice(){
  var bb=$('btnBackup');if(bb)bb.hidden=!isAdmin;
  var lo=$('btnLogout');if(lo){lo.hidden=!remote;lo.textContent=(isAdmin?'管理者':'同仁')+'・切換身分'}
  var n=$('notice');n.textContent='';
  if(remote&&!loaded&&!dbErr)n.appendChild(h('div',{class:'note soft',text:'連線中，請稍候…'}));
  if(mode==='local')n.appendChild(h('div',{class:'note soft',text:'示範模式：資料只存在這台裝置，不會與其他人共用。'}));
  if(mode==='shared'&&!canWrite)n.appendChild(h('div',{class:'note soft',text:'你目前只有檢視權限，無法登記或修改。請管理者將你的權限調整為 Contributor。'}));
  if(dbErr)n.appendChild(h('div',{class:'note err',text:dbErr}));
}
function renderAll(force){renderNotice();if(force||!isFormMode())renderCars()}
function saveCsv(name,rows){
  if(!dl){toast('此檢視環境無法下載檔案');return}
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  dl.save({filename:name,data:csv}).catch(function(e){if(!e||e.code!=='declined')toast('無法下載檔案')});
}

/* ================= vehicles (follows the paper form 車輛駕駛記錄表) ================= */
var cv={mode:'list'},sheetPlate='',TRIP_NORMAL_KM=10;
function isFormMode(){return cv.mode==='trip'}
function vehicle(p){return data.vehicles.find(function(v){return v.id===p})}
function logKey(l){return (l.date||'')+' '+(l.outTime||'')}
function logsOf(p){return data.vehicleLogs.filter(function(l){return l.plate===p}).sort(function(a,b){var x=logKey(a),y=logKey(b);return x<y?1:x>y?-1:(b.createdAt||0)-(a.createdAt||0)})}
function openLog(p){return logsOf(p).find(function(l){return l.status==='out'})||null}
function lastMileage(p){
  var l=logsOf(p).find(function(x){return x.status==='returned'&&x.retMileage!=null});
  if(l)return l.retMileage;var v=vehicle(p);return v&&v.lastMileage!=null?v.lastMileage:'';
}
function abnormal(l){return l.look==='bad'||l.cond==='bad'}
function mdOf(s){if(!s)return '';var d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()}
function goto(m,p){cv={mode:m,plate:p};renderCars();window.scrollTo(0,0)}
function gotoTrip(p,o){cv=Object.assign({mode:'trip',plate:p},o||{});renderCars();window.scrollTo(0,0)}
function fromHash(){
  var m=/^#?car-(.+)$/.exec(location.hash||'');
  if(m){cv={mode:'detail',plate:decodeURIComponent(m[1])};setTab('cars')}
}
window.addEventListener('hashchange',fromHash);
function statusPill(p){return null}
function lastBox(p){
  var l=logsOf(p).find(function(x){return x.status==='returned'&&x.retMileage!=null}),v=vehicle(p),km=lastMileage(p);
  var sub=l?mdOf(l.date)+' '+(l.retTime||'')+'　'+l.unit+' '+l.driver+'　'+l.route:(km!==''?'建檔里程，尚無行車紀錄':'尚無里程資料');
  return h('div',{class:'lastbox'},h('div',{class:'lb-k',text:'上次返回里程'}),h('div',{class:'lb-v mono',text:km===''?'—':km+' 公里'}),h('div',{class:'lb-s',text:sub}));
}
function markText(x,note){return x==='bad'?h('span',{class:'mk bad',text:'✕',title:note||'異常'}):h('span',{class:'mk ok',text:'✓',title:'正常'})}
function vState(p){
  var l=logsOf(p)[0],reps=data.vehicleRepairs.filter(function(r){return r.plate===p}),res={look:{bad:false},cond:{bad:false},note:''};
  if(!l)return res;
  var at=l.updatedAt||l.createdAt||0;
  ['look','cond'].forEach(function(k){
    if(l[k]!=='bad')return;
    var fixed=reps.some(function(r){return (r.items||[]).indexOf(k)>=0&&(r.at||0)>=at});
    res[k]={bad:!fixed};
  });
  if(res.look.bad||res.cond.bad)res.note=l.note||'';
  return res;
}
function stateLine(p){var s=vState(p);return h('span',null,'外觀 ',markText(s.look.bad?'bad':'ok'),'　車況 ',markText(s.cond.bad?'bad':'ok'))}
function repairPanel(v){
  var st=vState(v.id),reps=data.vehicleRepairs.filter(function(r){return r.plate===v.id}).sort(function(a,b){return (b.at||0)-(a.at||0)}).slice(0,3);
  if(!st.look.bad&&!st.cond.bad&&!reps.length)return null;
  var box=h('div',{class:'panel formcard'});
  if(st.look.bad||st.cond.bad){
    box.appendChild(h('h2',{style:'font-size:16px',text:'異常狀況（待維修）'}));
    box.appendChild(h('div',{text:(st.look.bad?'外觀 ✕　':'')+(st.cond.bad?'車況 ✕　':'')+(st.note?'說明：'+st.note:'')}));
    if(isAdmin&&canWrite){
      var cL=h('input',{type:'checkbox',checked:st.look.bad,disabled:!st.look.bad}),cC=h('input',{type:'checkbox',checked:st.cond.bad,disabled:!st.cond.bad});
      var rn=h('input',{type:'text',id:'repNote',placeholder:'修復說明（選填，例如：已更換後保險桿）'});
      box.appendChild(h('div',{class:'inline'},h('label',null,cL,'外觀已修復'),h('label',null,cC,'車況已修復')));
      box.appendChild(rn);
      box.appendChild(h('div',{class:'actions'},h('button',{type:'button',class:'primary',text:'標記已修復',onclick:async function(){
        var items=[];if(cL.checked&&!cL.disabled)items.push('look');if(cC.checked&&!cC.disabled)items.push('cond');
        if(!items.length){toast('請勾選已修復的項目');return}

    +'.vn{font-size:10pt;color:#333}'

    +'.ft{font-size:9.5pt;font-weight:700}'
    +'@media print{.tip{display:none}}'
    +'</style></head><body>'
    +'<div class="tip"><b>列印方式：</b>用瀏覽器開啟這個檔案，按 Ctrl＋P，紙張選 A4、縮放 100%，並勾選「背景圖形」。每台車有 2 張相同的標籤，沿虛線剪下，貼在車內明顯的位置（例如擋風玻璃內側與置物箱）。此提示不會被印出。</div>'
    +pages+'</body></html>';
  dl.save({filename:'車輛QRCode列印版_'+stamp+'.html',data:html}).then(function(){toast('已匯出 '+vs.length+' 台車、共 '+labels.length+' 張標籤')},function(e){if(!e||e.code!=='declined')toast('無法下載檔案')});
}

/* ================= backup and restore (admin) ================= */
var BK_LABEL={vehicles:'車輛',vehicleLogs:'車輛行車紀錄',vehicleRepairs:'外觀、車況修復紀錄',vehicleDeleted:'已刪除的行車紀錄',roster:'單位及使用人名單',places:'往返地點清單',settings:'系統設定'};
var BK_ORDER=['vehicles','roster','places','settings','vehicleLogs','vehicleRepairs','vehicleDeleted'];
var bkParsed=null;
function bkTable(rows){
  var tb=h('tbody');
  rows.forEach(function(r){tb.appendChild(h('tr',null,h('td',{style:'text-align:left',text:r[0]}),h('td',{class:'mono',text:String(r[1])}),r.length>2?h('td',{class:'mono',text:String(r[2])}):null))});
  return h('div',{class:'tablewrap'},h('table',null,tb));
}
function bkRefresh(){
  var box=$('bkSummary');box.textContent='';
  box.appendChild(h('div',{class:'empty',style:'margin-bottom:4px',text:'目前資料庫內容：'}));
  box.appendChild(bkTable(BK_ORDER.map(function(n){return [BK_LABEL[n],data[n].length+' 筆']})));
}
function bkOpen(){
  bkParsed=null;$('bkFile').value='';$('bkPreview').textContent='';$('bkProgress').textContent='';
  $('bkRestore').disabled=true;$('bkFullWrap').hidden=true;$('bkFull').checked=false;
  bkRefresh();$('dlgBackup').showModal();
}
$('btnBackup').onclick=bkOpen;
$('bkClose').onclick=function(){$('dlgBackup').close()};
$('bkDownload').onclick=function(){
  if(!dl){toast('此檢視環境無法下載檔案');return}
  var c={};NAMES.forEach(function(n){c[n]=data[n]});
  var body=JSON.stringify({app:'eip-booking',version:1,at:new Date().toISOString(),collections:c},null,1);
  var d=new Date(),name='借用系統備份_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
  dl.save({filename:name,data:body}).then(function(){toast('已備份 '+BK_ORDER.reduce(function(s,n){return s+data[n].length},0)+' 筆資料')},function(e){if(!e||e.code!=='declined')toast('無法下載檔案')});
};
$('bkFile').onchange=async function(){
  bkParsed=null;$('bkRestore').disabled=true;$('bkFullWrap').hidden=true;$('bkPreview').textContent='';$('bkProgress').textContent='';
  var f=this.files[0];if(!f)return;
  var prev=$('bkPreview');
  function fail(m){prev.appendChild(h('div',{class:'warn err',text:m}))}
  if(f.size>20*1024*1024){fail('備份檔超過 20 MB，無法還原。');return}
  var obj;try{obj=JSON.parse(await f.text())}catch(e){fail('這個檔案不是有效的備份檔（JSON 格式錯誤）。');return}
  if(!obj||obj.app!=='eip-booking'||!obj.collections||typeof obj.collections!=='object'){fail('這不是本系統的備份檔。');return}
  var ok=/^[A-Za-z0-9_\-.~:@+]{1,200}$/,cols={},skipped=0,rows=[];
  BK_ORDER.forEach(function(n){
    var arr=Array.isArray(obj.collections[n])?obj.collections[n]:[],good=[];
    arr.forEach(function(x){if(x&&typeof x==='object'&&typeof x.id==='string'&&ok.test(x.id)&&JSON.stringify(x).length<250000)good.push(x);else skipped++});
    cols[n]=good;rows.push([BK_LABEL[n],good.length+' 筆',data[n].length+' 筆']);
  });
  var total=BK_ORDER.reduce(function(s,n){return s+cols[n].length},0);
  if(!total){fail('備份檔裡沒有任何資料。');return}
  prev.appendChild(h('div',{class:'empty',text:'備份時間：'+(obj.at?new Date(obj.at).toLocaleString('zh-TW'):'未知')+'　｜　檔名：'+f.name}));
  var tb=h('tbody');rows.forEach(function(r){tb.appendChild(h('tr',null,h('td',{style:'text-align:left',text:r[0]}),h('td',{class:'mono',text:r[1]}),h('td',{class:'mono',text:r[2]})))});
  prev.appendChild(h('div',{class:'tablewrap'},h('table',null,h('thead',null,h('tr',null,h('th',{text:'項目'}),h('th',{text:'備份檔'}),h('th',{text:'目前'}))),tb)));
  if(skipped)prev.appendChild(h('div',{class:'warn soft',text:'有 '+skipped+' 筆資料格式不正確，還原時會略過。'}));
  bkParsed={cols:cols,total:total};$('bkRestore').disabled=!canWrite;$('bkFullWrap').hidden=false;
};
$('bkRestore').onclick=async function(){
  if(!bkParsed||!canWrite)return;
  var full=$('bkFull').checked,dels=[];
  if(full)BK_ORDER.forEach(function(n){var keep={};bkParsed.cols[n].forEach(function(x){keep[x.id]=1});data[n].forEach(function(x){if(!keep[x.id])dels.push([n,x.id])})});
  var msg='將把備份檔的 '+bkParsed.total+' 筆資料寫回資料庫，編號相同的現有資料會被覆蓋。'+(full?'同時會刪除 '+dels.length+' 筆備份檔裡沒有的現有資料（資料庫會還原成備份當時的樣子）。':'備份檔裡沒有的現有資料不會被刪除。')+'確定要還原嗎？';
  var r=await ask(msg,[['取消',0],[full?'確定完全還原':'確定還原',1,'danger']]);
  if(!r)return;
  var ops=[];BK_ORDER.forEach(function(n){bkParsed.cols[n].forEach(function(x){ops.push(['set',n,x])})});
  dels.forEach(function(d){ops.push(['del',d[0],d[1]])});
  var prog=$('bkProgress'),btn=$('bkRestore'),done=0;btn.disabled=true;$('bkFile').disabled=true;
  try{
    var step=remote?100:1;
    for(var i=0;i<ops.length;i+=step){
      await applyOps(ops.slice(i,i+step));
      done=Math.min(ops.length,i+step);
      prog.textContent='處理中… '+done+' / '+ops.length;
    }
    prog.textContent='完成：已處理 '+done+' 筆。';toast('已完成還原');bkParsed=null;$('bkFile').value='';$('bkPreview').textContent='';$('bkFullWrap').hidden=true;bkRefresh();
  }catch(e){
    prog.textContent='還原中斷：已處理 '+done+' / '+ops.length+' 筆。請確認權限後可重新匯入同一個備份檔繼續（同編號資料會直接覆蓋）。';
    writeErr(e);btn.disabled=false;
  }finally{$('bkFile').disabled=false}
};

/* ================= paper-format export of the vehicle driving log (車輛駕駛記錄表) ================= */
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function paperPage(v,trips,pageNo,pages){
  var PER=18,rows='';
  for(var i=0;i<PER;i++){
    var l=trips[i];
    if(l){
      var ret=l.status==='returned';
      var retT=ret?((l.retDate&&l.retDate!==l.date?mdOf(l.retDate)+' ':'')+(l.retTime||'')):'';
      rows+='<tr><td rowspan="2">'+escHtml(mdOf(l.date))+'</td><td rowspan="2">'+escHtml(l.unit)+'</td><td rowspan="2">'+escHtml(l.driver)+'</td><td rowspan="2" class="l">'+escHtml(l.route)+'</td>'
        +'<td class="n">'+escHtml(l.outMileage)+' 公里</td><td class="n">'+escHtml(l.outTime)+'</td>'
        +'<td rowspan="2" class="mk'+(l.look==='bad'?' bad':'')+'">'+(l.look==='bad'?'✕':'✓')+'</td><td rowspan="2" class="mk'+(l.cond==='bad'?' bad':'')+'">'+(l.cond==='bad'?'✕':'✓')+'</td></tr>'
        +'<tr><td class="n">'+(ret?escHtml(l.retMileage)+' 公里':'使用中')+'</td><td class="n">'+escHtml(retT)+'</td></tr>';
    }else{
      rows+='<tr><td rowspan="2"></td><td rowspan="2"></td><td rowspan="2"></td><td rowspan="2"></td><td class="n">&nbsp;</td><td class="n">&nbsp;</td><td rowspan="2"></td><td rowspan="2"></td></tr><tr><td class="n">&nbsp;</td><td class="n">&nbsp;</td></tr>';
    }
  }
  return '<section class="page"><table>'
    +'<colgroup><col style="width:9%"><col style="width:9%"><col style="width:12%"><col style="width:21%"><col style="width:17%"><col style="width:12%"><col style="width:10%"><col style="width:10%"></colgroup>'
    +'<thead><tr><th colspan="8" class="title">車輛駕駛記錄表</th></tr>'
    +'<tr><th colspan="8" class="plate">車號 :'+escHtml(v.plate)+(v.name?'　'+escHtml(v.name):'')+'</th></tr>'
    +'<tr><th>日期</th><th>單位</th><th>駕駛人</th><th>往返地點</th><th>出發里程數<br>返回里程數</th><th>出發時間<br>返回時間</th><th>外觀</th><th>車況*</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td colspan="8" class="note">備註：車況檢查包含儀表（油表、水溫及儀表各項燈號）、煞車、喇叭、燈號等。外觀、車況欄：✓ 表示正常，✕ 表示有異常。</td></tr></tfoot>'
    +'</table><div class="meta">第 '+pageNo+' / '+pages+' 頁</div></section>';
}
function exportPaper(){
  if(!dl){toast('此檢視環境無法下載檔案');return}
  var vs=data.vehicles.slice().sort(function(a,b){return a.id<b.id?-1:1});
  if(!vs.length){toast('尚未建立車輛');return}
  var body='',total=0;
  vs.forEach(function(v){
    var logs=data.vehicleLogs.filter(function(l){return l.plate===v.id}).sort(function(a,b){var x=logKey(a),y=logKey(b);return x<y?-1:x>y?1:(a.createdAt||0)-(b.createdAt||0)});
    total+=logs.length;
    var pages=Math.max(1,Math.ceil(logs.length/18));
    for(var p=0;p<pages;p++)body+=paperPage(v,logs.slice(p*18,p*18+18),p+1,pages);
  });
  var d=new Date(),stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var html='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>車輛駕駛記錄表 '+stamp+'</title><style>'
    +'@page{size:A4 portrait;margin:10mm}'
    +'*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#000;background:#fff}'
    +'.page{page-break-after:always;padding:6mm 0}.page:last-child{page-break-after:auto}'
    +'table{width:100%;border-collapse:collapse;table-layout:fixed;border:2px solid #000}'
    +'th,td{border:1px solid #000;text-align:center;padding:3px 2px;font-size:13px;height:25px;overflow-wrap:anywhere}'
    +'th{font-weight:400;line-height:1.25}.title{font-size:21px;letter-spacing:.9em;padding:8px 0 8px .9em}.plate{text-align:left;padding-left:8px;font-size:15px}'
    +'td.l{text-align:left;padding-left:6px}td.n{font-variant-numeric:tabular-nums}.mk{font-size:17px;font-weight:700}.mk.bad{color:#b3261e}'
    +'.note{text-align:left;font-size:12px;padding:6px 8px;height:auto}.meta{font-size:11px;color:#666;text-align:right;margin-top:4px}'
    +'</style></head><body>'+body+'</body></html>';
  dl.save({filename:'車輛駕駛記錄表_'+stamp+'.html',data:html}).then(function(){toast('已匯出紙本格式（共 '+total+' 趟）')},function(e){if(!e||e.code!=='declined')toast('無法下載檔案')});
}
$('bkPaper').onclick=exportPaper;
